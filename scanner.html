<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#101828;--mut:#667085;--line:#e7e9f2;--ac:#4f46e5;--ok:#12a150;--warn:#f08a00;--vip:#b7791f;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1020;color:#fff;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}
input,select{width:100%;border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:12px;padding:10px 12px;outline:none}
.sc{max-width:480px;margin:auto;padding:14px;min-height:100vh}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hd img{height:44px;max-width:96px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}
h2{margin:0;font-size:19px;font-weight:800}.d{opacity:.7}
.cam{position:relative;border-radius:22px;overflow:hidden;background:#000}video{width:100%;height:44vh;object-fit:cover;display:block;transition:opacity .2s}
.fr{position:absolute;inset:14%;pointer-events:none}.fr i{position:absolute;width:30px;height:30px;border:4px solid #a5b4fc}
.fr i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.fr i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.fr i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}.fr i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.ln{position:absolute;left:14%;right:14%;height:2px;background:#818cf8;box-shadow:0 0 14px #818cf8;animation:sw 2.2s ease-in-out infinite}
@keyframes sw{0%,100%{top:16%}50%{top:82%}}
.cam.paused video{opacity:.25}.cam.paused .ln,.cam.paused .fr{display:none}
.box{margin-top:12px;border-radius:18px;padding:14px;background:#fff;color:var(--tx)}.box h2{font-size:20px}.sub{color:var(--mut);font-size:12.5px}
.okb{background:#dcfce7;border:2px solid var(--ok)}.badb{background:#fee2e2;border:2px solid var(--bad)}
.ver{font-size:24px;font-weight:800;color:var(--ok)}.dup{font-size:24px;font-weight:800;color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer}
.btn.p{background:linear-gradient(135deg,#4f46e5,#7c3aed);border:0;color:#fff}.btn.ok{background:var(--ok);border:0;color:#fff}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:10px}.btn.s{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.6}
.tg{padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.Cash,.Online{background:#dcfce7;color:var(--ok)}.Pending{background:#ffedd5;color:var(--warn)}.Sponsor{background:#fef3c7;color:var(--vip)}
.row{display:flex;gap:8px;margin-top:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.f{display:grid;gap:5px;margin-bottom:10px;color:var(--tx)}.f label{font-size:12px;color:var(--mut);font-weight:600}
.svr2{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0}
.svr2.sel{border-color:var(--ac);background:#eef2ff}.svr2.done{background:var(--ok);border-color:var(--ok);color:#fff}
.svn{flex:1;cursor:pointer;padding:4px 0}.svn b{display:block;font-size:20px;font-weight:800;line-height:1.2}.svn small{display:block;color:var(--mut);font-weight:600;font-size:13px}.svr2.done small{color:#dcfce7}
.svs{display:flex;align-items:center;gap:8px}.svs button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ac);background:#fff;color:var(--ac);font:800 26px/1 Inter,system-ui,sans-serif;cursor:pointer;padding:0}
.svs .n,.svr2 .n{min-width:30px;text-align:center;font-size:26px;font-weight:800}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.acts2 .btn{padding:15px;font-size:17px;margin:0}
.err small{display:block;opacity:.75;margin-top:2px}.err{background:#fee2e2;border:1px solid var(--bad);color:#7f1d1d;border-radius:12px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.ov{position:fixed;inset:0;background:rgba(11,16,32,.72);display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.on{display:flex}#md2{z-index:12}
.sheet{background:#fff;color:var(--tx);width:100%;max-width:480px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.sheet .box{margin:0;padding:0;background:none;border:0}.sheet .box.okb,.sheet .box.badb{padding:12px;border-radius:16px}.sheet .box.okb{background:#dcfce7;border:2px solid var(--ok)}.sheet .box.badb{background:#fee2e2;border:2px solid var(--bad)}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:800}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--tx);padding:9px 16px;border-radius:99px;display:none;z-index:20;max-width:90%}
</style></head>
<body>
<div id="app"><div class="sc"><div class="d" style="padding-top:30vh;text-align:center">Loading...</div></div></div>
<div class="ov" id="md"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
var P=new URLSearchParams(location.search),U=P.get('u'),E=P.get('e'),T=P.get('t');
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fd=function(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'')};
var ft=function(s){var m=String(s||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return s||'';var h=+m[1],a=h>=12?'PM':'AM';h=h%12||12;return h+':'+m[2]+' '+a};
var busy=false,cur=null,tk=false,sel={},req=null,saving=false,addRid=null;
var rid=function(){return Math.random().toString(36).slice(2,12)+Date.now().toString(36)};
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2800)}
function setRes(h){$('#res').innerHTML=h}
function lastSid(){try{return localStorage.getItem('last')||''}catch(e){return ''}}
function setLast(v){try{localStorage.setItem('last',v)}catch(e){}}

/* ---- talking to the server: normal request first, script-tag (JSONP) as a fallback ---- */
function jsonp(params){
  return new Promise(function(ok,no){
    var cb='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');
    var t=setTimeout(function(){end();no(new Error('timeout'))},25000);
    function end(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)}
    window[cb]=function(j){end();ok(j)};
    s.onerror=function(){end();no(new Error('script failed'))};
    s.src=U+'?'+new URLSearchParams(Object.assign({callback:cb,_:Date.now()},params)).toString();
    document.head.appendChild(s);
  });
}
async function api(name,o){
  var params=Object.assign({api:name,e:E,t:T},o||{}),j,m1='',m2='';
  try{
    var r=await fetch(U+'?'+new URLSearchParams(Object.assign({_:Date.now()},params)).toString());
    var tx=await r.text();
    try{j=JSON.parse(tx)}catch(x){throw new Error('reply was not JSON (HTTP '+r.status+'): '+tx.replace(/\s+/g,' ').slice(0,90))}
  }catch(e1){
    m1=e1&&e1.message||String(e1);
    try{j=await jsonp(params)}catch(e2){m2=e2&&e2.message||String(e2);var er=new Error('Could not reach the server. Check the internet connection and tap Retry.');er.net=true;er.detail='fetch: '+m1+' | script: '+m2;throw er}
  }
  if(!j.ok)throw new Error(j.error||'Error');
  return j.d;
}

/* ---- popup (member details) ---- */
function pause(on){var c=$('#cam');if(c)c.classList.toggle('paused',!!on)}
function pop(h){$('#md').innerHTML='<div class="sheet">'+h+'</div>';$('#md').classList.add('on');pause(true)}
function resume(){$('#md').classList.remove('on');pause(false);busy=false;cur=null;req=null;saving=false;setRes('<div class="box">Point the camera at the pass QR code.</div>')}
function nextBtn(t){return '<button class="btn big" data-a="next">'+(t||'Scan next')+'</button>'}
function popMsg(h){pop('<div class="box badb">'+h+'</div>'+nextBtn())}

async function start(){
  if(!U||!E||!T){$('#app').innerHTML='<div class="sc"><div class="box badb">Invalid scanner link. Open it from the Links button in the admin dashboard.</div></div>';return}
  var d;
  try{d=await api('scanInfo')}catch(e){$('#app').innerHTML='<div class="sc"><div class="box badb">'+esc(e.message)+'</div></div>';return}
  $('#app').innerHTML='<div class="sc"><div class="hd">'+(d.logo?'<img src="'+esc(d.logo)+'" onerror="this.remove()">':'')+'<div><h2>'+esc(d.name)+'</h2><div class="d">'+fd(d.date)+' | '+ft(d.time)+'</div></div></div>'
   +'<div class="cam" id="cam"><video id="v" playsinline muted></video><div class="fr"><i></i><i></i><i></i><i></i></div><div class="ln"></div></div><canvas id="cv" hidden></canvas>'
   +'<div id="res"><div class="box">Starting camera...</div></div>'
   +'<button class="btn big" data-a="add">+ Add walk-in (manual pass)</button>'
   +'<div class="row"><input id="mp" placeholder="Pass ID (if QR does not scan)" style="background:#1b2240;border-color:#2c3560;color:#fff"><button class="btn p" data-a="look">Check</button></div></div>';
  cam();
}
async function cam(){
  try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    var v=$('#v');v.srcObject=st;await v.play();$('#cam').style.display='';busy=false;
    setRes('<div class="box">Point the camera at the pass QR code.</div>');
    if(!tk){tk=true;tick()}
  }catch(e){
    $('#cam').style.display='none';
    setRes('<div class="box" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span class="sub">Camera is off ('+esc((e&&e.name)||'error')+'). Allow camera for this site in the browser settings, then tap the button.</span><button class="btn s p" data-a="cam">Start camera</button></div>');
  }
}
function tick(){
  var v=$('#v');
  if(!busy&&v&&v.videoWidth){
    var k=Math.min(1,800/v.videoWidth),w=Math.round(v.videoWidth*k),h=Math.round(v.videoHeight*k),c=$('#cv');
    c.width=w;c.height=h;var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
    var code=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
    if(code)onCode(code.data);
  }
  requestAnimationFrame(tick);
}
function onCode(data){
  var p=String(data).split('|');busy=true;pause(true);if(navigator.vibrate)navigator.vibrate(60);
  if(p[0]!==E||!p[1])popMsg('<div class="dup">Wrong event</div>This pass belongs to a different event.');
  else look(p[1]);
}

/* ---- member popup with counters ---- */
function openLeft(s){return cur.qty-(cur.counts[s.id]||0)}
function initSel(){
  sel={};var open=cur.services.filter(function(s){return openLeft(s)>0});
  var pick=open.length===1?open[0]:open.find(function(s){return s.id===lastSid()});
  if(pick)sel[pick.id]=openLeft(pick);
}
function card(mode,err){
  var r=cur,sv=r.services,all=sv.every(function(s){return openLeft(s)<=0});
  var head=mode==='dup'?'<div class="dup">Already used</div>':mode==='saved'?'<div class="ver">Saved</div>':all?'<div class="ver">All done</div>':'';
  var rows=sv.map(function(s){
    var u=r.counts[s.id]||0,left=r.qty-u,id=esc(s.id);
    if(left<=0)return '<div class="svr2 done"><div class="svn"><b>'+esc(s.name)+'</b><small>Done '+u+'/'+r.qty+'</small></div><div class="n">&#10003;</div></div>';
    var n=sel[s.id]||0;
    return '<div class="svr2'+(n?' sel':'')+'" id="rw-'+id+'"><div class="svn" data-a="row" data-i="'+id+'"><b>'+esc(s.name)+'</b><small>'+u+'/'+r.qty+' done</small></div><div class="svs"><button data-a="mi" data-i="'+id+'">-</button><span class="n" id="n-'+id+'">'+n+'</span><button data-a="pl" data-i="'+id+'">+</button></div></div>';
  }).join('');
  var foot=(mode==='dup'||mode==='saved'||all)?nextBtn():'<div class="acts2"><button class="btn" data-a="next">Cancel</button><button class="btn ok" id="okb" data-a="ok">Confirm</button></div>';
  pop('<div class="box'+(mode==='dup'?' badb':(mode==='saved'||all)?' okb':'')+'">'+head
   +'<h2>'+esc(r.name)+(r.pay==='Sponsor'?' <span class="tg Sponsor">VIP</span>':'')+'</h2>'+r.qty+' pass'+(r.qty>1?'es':'')+' | <span class="tg '+esc(r.pay)+'">'+esc(r.pay)+'</span>'+(r.remarks?'<div class="sub">Note: '+esc(r.remarks)+'</div>':'')
   +rows
   +(err?'<div class="err"><span>'+esc(err.msg)+(err.detail?'<small>'+esc(err.detail)+'</small>':'')+'</span>'+(err.retry?'<button class="btn s" data-a="retry">Retry</button>':'')+'</div>':'')
   +(mode!=='saved'&&mode!=='dup'&&r.pay==='Pending'?'<div class="f"><label>Payment received</label><select id="cp"><option>Pending</option><option>Cash</option><option>Online</option></select></div>':'')
   +(mode!=='saved'&&mode!=='dup'&&!all?'<div class="f"><label>Remarks</label><input id="cr" placeholder="e.g. Remaining 2 members coming later"></div>':'')
   +foot+'</div>');
}
function setN(sid,n){
  var s=cur.services.find(function(z){return z.id===sid});if(!s)return;
  n=Math.max(0,Math.min(openLeft(s),n));sel[sid]=n;
  var el=$('#n-'+sid),row=$('#rw-'+sid);if(el)el.textContent=n;if(row)row.classList.toggle('sel',n>0);
}
async function look(pid){
  if(!pid)return;busy=true;pause(true);setRes('<div class="box">Checking pass...</div>');
  try{
    var r=await api('scanLookup',{pid:pid});
    if(!r.services)r.services=[{id:'entry',name:'Entry'}];if(!r.counts)r.counts={entry:r.entered||0};cur=r;
    var all=r.services.every(function(s){return openLeft(s)<=0});
    if(!all)initSel();card(all?'dup':'');
  }catch(e){popMsg(esc(e.message))}
}
function finish(d){
  saving=false;req=null;cur.counts=d.counts;cur.pay=d.pay;cur.remarks=d.remarks;
  var ids=Object.keys(d.applied||{});if(ids.length===1)setLast(ids[0]);
  sel={};if(navigator.vibrate)navigator.vibrate(100);card('saved');
  setTimeout(function(){if(cur&&$('#md').classList.contains('on'))resume()},900);
}
async function confirmSave(again){
  if(saving)return;
  if(!again){
    var items=Object.keys(sel).filter(function(k){return sel[k]>0}).map(function(k){return k+':'+sel[k]}).join(',');
    if(!items)return toast('Select at least one counter first');
    var pay=$('#cp')?$('#cp').value:'',rm=$('#cr')?$('#cr').value.trim():'';
    req={items:items,rid:rid(),pay:pay==='Pending'?'':pay,rm:rm};
  }
  saving=true;var b=$('#okb');if(b){b.disabled=true;b.textContent='Saving...'}
  try{
    finish(await api('useSvcs',{pid:cur.id,items:req.items,remarks:req.rm,pay:req.pay,rid:req.rid}));
  }catch(e){
    if(e.net){ // the save may have worked even though the reply was lost: ask the server what happened
      try{var d2=await api('res',{q:req.rid});if(d2){finish(d2);return}}catch(x){}
    }
    saving=false;if(!e.net)req=null;
    card('',{msg:e.message,detail:e.detail,retry:!!e.net});
  }
}

/* ---- walk-in ---- */
function addForm(){
  addRid=rid();pause(true);
  $('#md').innerHTML='<div class="sheet"><h3>Walk-in registration</h3><div class="f"><label>Name</label><input id="sn"></div>'
   +'<div class="g2"><div class="f"><label>Mobile</label><input id="sm" type="tel"></div><div class="f"><label>Quantity</label><input id="sq" type="number" min="1" value="1"></div></div>'
   +'<div class="f"><label>Payment status</label><select id="sp"><option>Cash</option><option>Online</option><option>Pending</option><option>Sponsor</option></select></div>'
   +'<div class="f"><label>Remarks</label><input id="sk"></div><div class="acts"><button class="btn" data-a="close">Cancel</button><button class="btn p" id="ss" data-a="save">Save</button></div></div>';
  $('#md').classList.add('on');
}
async function saveAdd(){
  var o={name:$('#sn').value.trim(),mobile:$('#sm').value.trim(),qty:$('#sq').value,pay:$('#sp').value,remarks:$('#sk').value.trim(),rid:addRid};
  if(!o.name||!o.mobile)return toast('Name and mobile are required');
  var b=$('#ss');b.disabled=true;
  try{var pid=await api('scanAdd',o);look(pid)}
  catch(e){
    if(e.net){try{var p2=await api('res',{q:addRid});if(p2){look(p2);return}}catch(x){}}
    toast(e.message);b.disabled=false;
  }
}

var A={
  next:resume,close:resume,
  look:function(){var v=$('#mp').value.trim().toUpperCase();if(v){busy=true;look(v)}},
  row:function(i){var s=cur.services.find(function(z){return z.id===i});if(s)setN(i,(sel[i]||0)>0?0:openLeft(s))},
  mi:function(i){setN(i,(sel[i]||0)-1)},pl:function(i){setN(i,(sel[i]||0)+1)},
  ok:function(){confirmSave(false)},retry:function(){if(req)confirmSave(true)},
  add:addForm,save:saveAdd,cam:cam
};
document.addEventListener('click',function(e){
  if(e.target.id==='md')return resume();
  var b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i);
});
start();
</script></body></html>
